[project]
name = "stratum-lens"
version = "0.1.1"
description = "Semantic workspace indexer for OpenClaw — query your memory files by meaning"
authors = [{name = "Stratum", email = "agent@example.com"}]
requires-python = ">=3.11"

dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "click>=8.5.0",
    "rich>=15.0.0",
]

[project.scripts]
stratum-lens = "stratum_lens.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
